[project]
name = "simagent"
version = "0.1.0"
description = "Natural-language molecular simulation agent: plans GROMACS workflows, runs them through MCP tools, and analyzes the results."
readme = "prd.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",   # official MCP Python SDK 2.x (server class MCPServer, client ClientSession, stdio transport)
    "openai",      # OpenAI-compatible client for the gpt6-luna endpoint
    "pydantic",    # typed tool inputs and outputs
    "pyyaml",      # config.yaml
    "jinja2",      # MDP templates
    "numpy",       # analysis
    "matplotlib",  # plots
    "filelock",    # file locking for the ledger, job.json, and memory
]

[project.scripts]
simagent = "simagent.cli:main"
gmx-mcp = "simagent.mcp_server.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simagent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# S602 and S605 forbid shell=True and os.system (NFR-01, RULE-X-01).
select = ["E", "F", "I", "S602", "S605"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "posix: needs POSIX features (process groups, /proc, executing a #! script); skipped on Windows",
    "real_gmx: needs the real GROMACS binary named by GMX_BIN; skipped otherwise",
    "slow: long-running test",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
